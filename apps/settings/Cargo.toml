[package]
name = "helix-settings-app"
description = "Settings for the Helix desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Not named `helix-settings`: helix-desktop already has a crate of that name.
[[bin]]
name = "helix-settings-app"
path = "src/main.rs"

[dependencies]
gtk.workspace = true
adw.workspace = true
helix-app-common.workspace = true
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
async-channel = "2"
serde.workspace = true
serde_json.workspace = true
qrcode = { version = "0.14", default-features = false }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
helix-test-audio = { path = "../../crates/helix-test-audio" }
