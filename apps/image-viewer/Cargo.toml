[package]
name = "helix-image-viewer"
description = "Image viewer for the Helix desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "helix-image-viewer"
path = "src/main.rs"

[dependencies]
gtk.workspace = true
adw.workspace = true
helix-app-common.workspace = true
exif = { package = "kamadak-exif", version = "0.5" }
image = { version = "0.25", default-features = false, features = ["gif", "webp", "qoi"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
libc = "0.2"
async-channel = "2"

[dev-dependencies]
tempfile = "3"
