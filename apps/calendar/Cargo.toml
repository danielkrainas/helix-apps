[package]
name = "helix-calendar"
description = "Calendar for the Helix desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "helix-calendar"
path = "src/main.rs"

[dependencies]
gtk.workspace = true
adw.workspace = true
helix-app-common.workspace = true
helix-eds = { path = "../../crates/helix-eds" }
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
