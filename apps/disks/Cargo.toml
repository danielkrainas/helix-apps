[package]
name = "helix-disks"
description = "Disk management for the Helix desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "helix-disks"
path = "src/main.rs"

[dependencies]
gtk.workspace = true
adw.workspace = true
helix-app-common.workspace = true
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
async-channel = "2"
serde.workspace = true
pangocairo = "0.20"
