[package]
name = "helix-camera"
description = "Camera for the Helix desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "helix-camera"
path = "src/main.rs"

[dependencies]
gtk.workspace = true
adw.workspace = true
glib.workspace = true
gio.workspace = true
helix-app-common.workspace = true
serde.workspace = true
serde_json.workspace = true
gst = { package = "gstreamer", version = "0.23" }
gst-app = { package = "gstreamer-app", version = "0.23" }
gst-video = { package = "gstreamer-video", version = "0.23" }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
async-channel = "2"
rqrr = { version = "0.11", default-features = false }

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
