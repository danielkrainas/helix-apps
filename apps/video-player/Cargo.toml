[package]
name = "helix-video-player"
description = "Video player for the Helix desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "helix-video-player"
path = "src/main.rs"

[dependencies]
gtk.workspace = true
adw.workspace = true
helix-app-common.workspace = true
serde.workspace = true
serde_json.workspace = true
gst = { package = "gstreamer", version = "0.23" }
gst-app = { package = "gstreamer-app", version = "0.23" }
gst-video = { package = "gstreamer-video", version = "0.23" }
gst-pbutils = { package = "gstreamer-pbutils", version = "0.23" }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
async-channel = "2"

[dev-dependencies]
tempfile = "3"
