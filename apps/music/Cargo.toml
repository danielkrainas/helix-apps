[package]
name = "helix-music"
description = "Music library and player for the Helix desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "helix-music"
path = "src/main.rs"

[dependencies]
gtk.workspace = true
adw.workspace = true
glib.workspace = true
gio.workspace = true
helix-app-common.workspace = true
serde.workspace = true
serde_json.workspace = true
gst = { package = "gstreamer", version = "0.23" }
lofty = "0.25"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
async-channel = "2"
unicode-normalization = "0.1"
roxmltree = "0.20"

[dev-dependencies]
tempfile = "3"
