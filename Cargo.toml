[workspace]
members = [
    "crates/helix-app-common",
    "apps/calculator",
    "apps/characters",
    "apps/tour",
    "apps/system-monitor",
    "apps/logs",
    "apps/disk-usage",
    "apps/weather",
    "apps/fonts",
    "apps/image-viewer",
    "apps/clocks",
    "apps/text-editor",
    "apps/settings",
    "apps/disks",
    "apps/files",
    "apps/terminal",
    "apps/video-player",
    "apps/camera",
    "apps/audio-player",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"
authors = ["Daniel Krainas"]
repository = "https://github.com/danielkrainas/helix-apps"

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
glib = "0.20"
gio = "0.20"
helix-app-common = { path = "crates/helix-app-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
