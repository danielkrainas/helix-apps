<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The session bus for test runs: like the standard session bus, but
     with NO service directories, so nothing real (permission store,
     gvfs, portals, keyrings, dconf) can be started on it by activation.
     Pass it to dbus-run-session as its config file (see run-tests.sh);
     tests that need their own bus use helix_app_common::test_bus. -->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
